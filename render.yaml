services:
  - type: web
    name: expensepilot-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "/app"
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: expensepilot
      - key: GEMINI_API_KEY
        sync: false
      - key: MINDEE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

